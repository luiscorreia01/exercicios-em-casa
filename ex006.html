<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relembrando criação de páginas</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Colocando uma imagem dinamica no meu site</h1>
    <br>
    <picture>
        <source media="(max-width:1250px)" srcset="imagens/paisagem-450.jpg" type="image/jpg">
        <img src="imagens/paisagem-800.jpg" alt="">
    </picture>

    <h1>Adicionando audios no meu site</h1>
    <audio controls preload="metadata">
        <source src="midia/miragemelody.mp3" type="audio/mpeg">
        <source src="midia/miragemelody.ogg" type="audio/ogg">
        <source src="midia/miragemelody.wav" type="type/wav">
    </audio>

    <h1>Adicionando vídeos de hospedagem própria</h1>
    <video src="midia/meu-video.mp4" controls width="500px"></video>

</body>
</html>
