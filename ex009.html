<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criando um Formulário</title>
</head>
<body>
    <h1>Criando Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" required autocomplete="username">
                <label for="isobn">Sobrenome:</label>
                <input type="text" name="sobn" id="isobn" required>

                <label for="isexmasc">Masculino</label>
                <input type="radio" name="sexo" id="isexmasc" required>
                <label for="isexo">Feminino</label>
                <input type="radio" name="sexo" id="isexfem" required>

                <p>
                    <label for="itel">Telefone:</label>
                    <input type="tel" name="tel" id="itel" required placeholder="(xx)xxxxx-xxxx" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
                    <label for="isen">Senha:</label>
                    <input type="password" name="Senha" id="isen" required autocomplete="current-password">
                </p>

                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
            </fieldset>

        </p>
    </form>
</body>
</html>
