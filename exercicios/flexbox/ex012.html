<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>

        .container {
            background-color: black;
            display: flex;
            flex-flow: row nowrap;


            
        }

        .item {
            background-color: gray;
            flex-basis: 300px;
            border: 1px solid black;
            text-align: center;
            padding: 5px;
            
        }

        div#it1 {
            flex-grow: 0;
            flex-shrink: 1;
        }

        div#it2 {
            flex-grow: 2;
            flex-shrink: 0;
        }

        div#it3 {
            flex-grow: 4;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="it1">A</div>
        <div class="item" id="it2">B</div>
        <div class="item" id="it3">C</div>

        </div>
    </div>
</body>
</html>
