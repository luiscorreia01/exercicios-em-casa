<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>
<body>
    <h1>Formulário com output</h1>
    <form action="cadastro.php">
        <p>
            <label for="in1">número 1:</label>
            <input type="number" name="num" id="in1" required min="0" max="50" oninput="isoma.innerHTML = Number (in1.value) + Number (in2.value)">
        </p>
        <p>
            <label for="in2">número 2:</label>
            <input type="number" name="num2" id="in2" min="0" max="50" oninput="isoma.innerHTML = Number (in1.value) + Number (in2.value)">
        </p>
        <p>
            <label for="isoma">Soma:</label>
            <output id="isoma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
