<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novos atributos para formulários</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        
        }
        header {
            height: 100px;
            width: 100vw;
            background-image: linear-gradient(to right, blue, red);
        }

        h1 {
            text-align: center;
            padding: 20px;
            color: white;
        }
        fieldset#dados {
            margin: 30px 10px 5px 10px;
            padding: 10px;
            height: 800px;
            width: 600px;
            background-color: lightgray;
        }

        fieldset#esportes {
            border: 0px;
            
        }

        legend {
            margin: 10px;
        }
       
        p {
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Aplicando novos atributos nos formulários</h1>
    </header>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset id="dados">
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" required minlength="5" maxlength="20" autocomplete="username" placeholder="nome do usuário">
                <label for="isobn">Sobrenome:</label>
                <input type="text" name="sobn" id="isobn">
                
            </p>
            <p>
                
                <input type="radio" name="sexo" id="isxmas">
                <label for="isdxmas">Masculino</label>
                <input type="radio" name="sexo" id="isxfem">
                <label for="isxfem">Feminino</label>
                <br>
                <br>
                <label for="iest">Estado:</label>
                <select name="est" id="iest">
                    <optgroup label="Estados">
                        <option value="">--- Escolha ---</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="PE">Pernambuco</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <label for="ipfro">Profissão desejada:</label>
                <input type="text" name="prof" id="iprof" list="listprof">
                <datalist id="listprof">
                    
                    <option >Pofessor</option>
                    <option >Ator</option>
                    <option >Jardineiro</option>
                    <option >Auxiliar de Produção</option>
                    <option >Gerente de Banco</option>
                    <option >Desenvolvedor</option>
                </datalist>
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input type="email" name="email" id="iemail" required autocomplete="email" maxlength="30">
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel" placeholder="(xx)xxxxx-xxxx" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
            <p>
                <label for="idata">Data de Hoje:</label>
                <input type="date" name="data" id="idata" required value="2025-03-26" >
                <label for="imed">Média do Aluno:</label>
                <input type="number" name="media" id="imed" required step="0.25" min="4" max="10" >
            </p>
            <p>
                <fieldset id="esportes">
                    <legend>Esportes Praticados</legend>
                    <input type="checkbox" name="esfut" id="iesfu"> 
                    <label for="iesfut">Futebol</label><br>
                    <input type="checkbox" name="esvol" id="iesvol"> 
                    <label for="iesvol"> Vôlei</label>
                </fieldset>
            </p>
            <p>
                <label for="icor">Selecione sua cor favorita:</label>
                <input type="color" name="cor" id="icor"> <br>
                <label for="isat">Nível de satisfação com a escola:</label>
                <input type="range" name="sat" id="isat" min="1" max="10"><br>
                <label for="ifoto">Envie uma foto sua:</label>
                <input type="file" name="foto" id="ifoto">
            </p>
            <p>
                <label for="imsg">Deixe sua mensagem:</label><br><br>
                <textarea name="msg" id="imsg" cols="80" rows="6"></textarea>
            </p>
          
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
       
    </form>
</body>
</html>
