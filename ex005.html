<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando GET e POST</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif
        }
    </style>
</head>
<body>
    <h1>Treinando os formulários com GET e POST</h1>
    <h2>Método GET</h2>
    <form action="form.php" method="get">
        <p><label for="nome">Nome:</label> 
            <input type="text" name="nome" id="nome"></p>
        <p><label for="sobrenome">Sobrenome:</label> 
            <input type="text" name="sobrenome" id="sobrenome"></p>
        <input type="submit" value="Enviar">
    </form>
<br>
<br>
    <h2>Método POST</h2>
    <form action="form1.php">
        <p><label for="cpf">CPF:</label> 
            <input type="text" name="cpf" id="cpf"></p>
        <p><label for="email">E-mail:</label> 
            <input type="text" name="email" id="email"></p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
