<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando formulário
    </title>
</head>
<body>
    <h1>Formulários com output</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="in1">Número 1:</label>
            <input type="number" name="n1" id="in1" required min="1" max="10" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="in2">Número: 2</label>
            <input type="number" name="n2" id="in2" required min="1" max="10" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="isoma">Soma:</label>
            <output id="isoma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

    <form action="cadastro.php">
        <p>
            <label for="inum">Nível de satisfação</label>
            <input type="range" name="val" id="inum" required min="0" max="10" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>
    </form>


</body>
</html>
