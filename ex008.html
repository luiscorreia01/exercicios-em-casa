<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novos atributos para formulários</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        
        }
        header {
            height: 100px;
            width: 100vw;
            background-image: linear-gradient(to right, blue, red);
        }

        h1 {
            text-align: center;
            padding: 20px;
            color: white;
        }
        fieldset {
            margin: 30px 10px 5px 10px;
            padding: 10px;
            height: 200px;
            width: 600px;
            background-color: lightgray;
        }
       
        p {
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Aplicando novos atributos nos formulários</h1>
    </header>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required minlength="5" maxlength="15" autocomplete="username">
                <label for="isnome">Sobrenome</label>
                <input type="text" name="snome" id="isnome" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
                <label for="inasc">Data de Nascimento</label>
                <input type="date" name="nasc" id="inasc" required value="2025-03-25">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" required placeholder="(xx)xxxxx-xxxx" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
        
        </fieldset>
        <br>
        <input type="submit" value="Enviar" id="botoes">
        <input type="reset" value="Limpar" id="botoes">
    </form>
</body>
</html>
